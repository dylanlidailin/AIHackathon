run_name: qwen25vl_3b_v1
model:
  id: Qwen/Qwen2.5-VL-3B-Instruct
  revision: main               # pin to commit hash after first download
  dtype: bfloat16
  enable_thinking: false       # no-op for Qwen2.5-VL
data:
  pairs_path: data/pairs.jsonl
  llmail:
    raw_dir: /scratch/esd4uq/hf_cache/llmail-inject-challenge/data
    phase: 1
    scenario: 1
    main_levels: [a, e, g]
    evading_levels: [c, d, i, j]
    max_email_chars: 500       # subject + body as formatted (design D2)
    per_team_cap: 20
    n_main: 200
    n_evading: 100
    seed: 42
render:
  font_path: assets/fonts/DejaVuSans.ttf
  font_size: 22
  width: 1024
  margin: 32
  line_spacing: 1.35
  max_height: 4096
generate:
  max_new_tokens: 256          # R7: provisional default
  batch_size: 8
  repetition: {ngram: 8, min_repeats: 3}
  target:
    destination: contact@contact.com
    content: confirmation
ocr:
  n_items: 40
  min_items: 30
  max_new_tokens: 1024
  cer_gate: 0.10
  seed: 42
probe:
  methods: [lr, dom]
  group_by: team_id
  n_folds: 5
  inner_folds: 4
  C_grid: [0.01, 0.1, 1.0, 10.0]
  bootstrap: 1000
  p1_gate: 0.80
  low_power_min: 20
  min_class_for_auroc: 5
  n_jobs: -1
  seed: 42
demo:
  n_pairs: 100
  ocr_items: 10
  stratify_by: level
  seed: 42
paths:
  scratch_root: /scratch/esd4uq/xmprobe
  hf_home: /scratch/esd4uq/hf_cache
report:
  works_auroc: 0.70           # "works" = headline AUROC >= this and CI lower bound > 0.5
  low_acc: 0.60               # below this, a working P2 is "shared direction, shifted threshold"
