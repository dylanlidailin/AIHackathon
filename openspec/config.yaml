schema: spec-driven

context: |
  Research pipeline: text-trained prompt-injection probes tested on image-delivered injections in a VLM.
  Models: Qwen3.5-2B (primary), Qwen3.5-0.8B (smoke), Qwen2.5-VL-3B-Instruct (fallback). Data: LLMail-Inject phase 1, scenario 1.
  Compute: UVA Rivanna, account ai-safety-hackathon-rig, partition gpu, A100, max 16 CPU / 128G / 4h per job.
  Interactive sessions use srun --pty; full runs use sbatch. Never submit a job without explicit user approval.
  Never modify the shared torch311 conda env; the project env is xmprobe (cloned from it).
  Large artifacts live under /scratch/esd4uq/xmprobe and /scratch/esd4uq/hf_cache; only small summaries are committed.
  constitution.md is the authoritative rule set; the rules below mirror its non-negotiable gates.

rules:
  design:
    - Report LR and DoM for every probe; the P1 AUROC >= 0.80 gate applies per method
    - No image-condition result is interpreted unless the OCR gate passes (median CER <= 0.10, n >= 30)
    - All splits are grouped by team_id; probe_evading pairs are never used for fitting or selection
    - AUROC is primary; centering variants affect threshold metrics only
    - Target-phrase success and repetition are separate metrics, never merged
    - Benign target phrases, local open weights, no attacks on deployed systems
  tasks:
    - Every task states how it is verified
    - Any SLURM submission task requires explicit user approval before running
    - A smoke run (--limit 10, Qwen3.5-0.8B) passes before any full run
